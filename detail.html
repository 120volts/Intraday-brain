<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0f14"><title>Intraday Brain · Detail</title><style>:root{color-scheme:dark;--bg:#0b0f14;--panel:#121821;--line:#273241;--text:#f5f7fa;--muted:#8f9aaa;--accent:#7dd3fc;--good:#7ee2a8;--warn:#f5d27a;--bad:#ff8f8f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:760px;margin:auto;padding:20px 16px 40px}.top{display:flex;justify-content:space-between;align-items:center}a,button{color:var(--text);background:#171f2a;border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-decoration:none;font:inherit}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:12px}.big{font-size:34px;font-weight:800}.muted{color:var(--muted);font-size:13px}.good{color:var(--good)}.warn{color:var(--warn)}.bad{color:var(--bad)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#10161e;border:1px solid var(--line);border-radius:12px;padding:12px}.label{color:var(--muted);font-size:12px}.value{font-weight:700;margin-top:4px}.bar{height:10px;background:#202a36;border-radius:10px;overflow:hidden}.fill{height:100%;background:var(--accent)}.reason{padding:8px 0;border-bottom:1px solid var(--line)}.reason:last-child{border:0}</style></head><body><main><div class="top"><a href="index.html">← Dashboard</a><span class="muted">PAPER ONLY</span></div><div id="content" class="card"><div class="muted">Loading…</div></div></main><script>const API=localStorage.getItem('intraday_api')||((location.hostname==='127.0.0.1'||location.hostname==='localhost')?'http://'+location.hostname+':8000':'');const symbol=new URLSearchParams(location.search).get('symbol')||'SPY';const money=v=>v==null?'—':new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:2}).format(v);async function run(){try{const data=await fetch(API+'/api/scanner',{cache:'no-store'}).then(r=>r.json());const x=data.find(a=>a.symbol===symbol)||data[0];if(!x)throw Error('No scanner data');const reasons=(x.reason||'No qualifying factors').split(',').map(s=>`<div class="reason">${s.trim()}</div>`).join('');document.title='Intraday Brain · '+x.symbol;document.querySelector('#content').innerHTML=`<div class="muted">${x.symbol}</div><div class="big">${money(x.price)}</div><div class="${x.state==='SETUP'||x.state==='TREND'?'good':x.state==='ERROR'||x.state==='NO DATA'?'bad':'warn'}">${x.state} · score ${x.score}/100</div><div class="card"><div class="grid"><div class="metric"><div class="label">VWAP</div><div class="value">${money(x.vwap)}</div></div><div class="metric"><div class="label">Relative volume</div><div class="value">${Number(x.rvol||0).toFixed(2)}×</div></div></div><div style="margin-top:14px"><div class="label">Setup strength</div><div class="bar"><div class="fill" style="width:${Math.min(100,Math.max(0,x.score||0))}%"></div></div></div></div><div class="card"><h3>Why the bot scored it this way</h3>${reasons}</div><div class="card"><div class="muted">Next</div><p>When the strategy is enabled, this screen will also show entry zone, stop, target, reward/risk and live position state.</p></div>`}catch(e){document.querySelector('#content').innerHTML='<div class="bad">Unable to load scanner data: '+e.message+'</div>'}}run();setInterval(run,15000);</script></body></html>
