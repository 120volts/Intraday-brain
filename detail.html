<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0f14"><title>Intraday Brain · Detail</title><style>:root{color-scheme:dark;--bg:#0b0f14;--panel:#121821;--line:#273241;--text:#f5f7fa;--muted:#8f9aaa;--accent:#7dd3fc;--good:#7ee2a8;--warn:#f5d27a;--bad:#ff8f8f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:820px;margin:auto;padding:20px 16px 40px}.top{display:flex;justify-content:space-between;align-items:center}a,button{color:var(--text);background:#171f2a;border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-decoration:none;font:inherit}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:12px}.big{font-size:34px;font-weight:800}.muted{color:var(--muted);font-size:13px}.good{color:var(--good)}.warn{color:var(--warn)}.bad{color:var(--bad)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.metric{background:#10161e;border:1px solid var(--line);border-radius:12px;padding:12px}.label{color:var(--muted);font-size:12px}.value{font-weight:700;margin-top:4px}.chart{width:100%;height:300px;background:#0e141c;border:1px solid var(--line);border-radius:12px;margin-top:12px}.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--muted)}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--accent);margin-right:4px}.reason{padding:9px 0;border-bottom:1px solid var(--line)}.reason:last-child{border:0}.fill{height:8px;background:var(--accent);border-radius:8px}.barbg{height:8px;background:#202a36;border-radius:8px;overflow:hidden}</style></head><body><main><div class="top"><a href="index.html">← Dashboard</a><span class="muted">YAHOO DATA · PAPER ONLY</span></div><div id="content" class="card"><div class="muted">Loading…</div></div></main><script>const API=localStorage.getItem('intraday_api')||((location.hostname==='127.0.0.1'||location.hostname==='localhost')?'http://'+location.hostname+':8000':'');const symbol=(new URLSearchParams(location.search).get('symbol')||'SPY').toUpperCase();const money=v=>v==null?'—':new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:2}).format(v);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function path(vals,min,max,w,h,pad=20){const good=vals.map((v,i)=>[v,i]).filter(x=>x[0]!=null);if(!good.length)return '';return good.map(([v,i],j)=>{const x=pad+(i/(vals.length-1||1))*(w-pad*2);const y=pad+(1-(v-min)/(max-min||1))*(h-pad*2);return (j?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)}).join(' ')}function chartSvg(bars,ind){const w=760,h=300,p=24;const close=bars.map(b=>b.c),vwap=bars.map(()=>ind.vwap),e9=bars.map(()=>ind.ema9),e20=bars.map(()=>ind.ema20),orh=bars.map(()=>ind.opening_high),orl=bars.map(()=>ind.opening_low);const vals=[...close,...vwap,...e9,...e20,...orh,...orl].filter(Number.isFinite);let min=Math.min(...vals),max=Math.max(...vals);const pad=(max-min)*.08||1;min-=pad;max+=pad;return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><path d="${path(orh,min,max,w,h,p)}" fill="none" stroke="#f5d27a" stroke-width="1" stroke-dasharray="5 5"/><path d="${path(orl,min,max,w,h,p)}" fill="none" stroke="#f5d27a" stroke-width="1" stroke-dasharray="5 5"/><path d="${path(vwap,min,max,w,h,p)}" fill="none" stroke="#7dd3fc" stroke-width="2"/><path d="${path(e9,min,max,w,h,p)}" fill="none" stroke="#7ee2a8" stroke-width="1.5"/><path d="${path(e20,min,max,w,h,p)}" fill="none" stroke="#ff8f8f" stroke-width="1.5"/><path d="${path(close,min,max,w,h,p)}" fill="none" stroke="#f5f7fa" stroke-width="2.5"/></svg>`}async function run(){try{const data=await fetch(API+'/api/chart/'+encodeURIComponent(symbol),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status+' '+r.statusText);return r.json()});const ind=data.indicators||{};const state=ind.state||'WAIT';const cls=state==='SETUP'||state==='TREND'?'good':state==='ERROR'?'bad':'warn';const reasons=(ind.reason||'No qualifying setup factors yet').split(',').map(s=>`<div class="reason">${esc(s.trim())}</div>`).join('');document.title='Intraday Brain · '+symbol;document.querySelector('#content').innerHTML=`<div class="muted">${symbol} · ${esc(data.source||'Yahoo Finance')}</div><div class="big">${money(ind.price)}</div><div class="${cls}">${state} · score ${ind.score||0}/100</div>${chartSvg(data.bars,ind)}<div class="legend"><span>□ Price</span><span>— VWAP</span><span>— EMA9</span><span>— EMA20</span><span>-- Opening range</span></div><div class="card"><div class="grid"><div class="metric"><div class="label">VWAP</div><div class="value">${money(ind.vwap)}</div></div><div class="metric"><div class="label">RVOL</div><div class="value">${ind.rvol==null?'—':Number(ind.rvol).toFixed(2)+'×'}</div></div><div class="metric"><div class="label">EMA9</div><div class="value">${money(ind.ema9)}</div></div><div class="metric"><div class="label">EMA20</div><div class="value">${money(ind.ema20)}</div></div><div class="metric"><div class="label">Opening high</div><div class="value">${money(ind.opening_high)}</div></div><div class="metric"><div class="label">Opening low</div><div class="value">${money(ind.opening_low)}</div></div></div><div style="margin-top:14px"><div class="label">Setup strength</div><div class="barbg"><div class="fill" style="width:${Math.min(100,Math.max(0,ind.score||0))}%"></div></div></div></div><div class="card"><h3>What the system sees</h3>${reasons}<p class="muted">WAIT means the conditions are not strong enough yet. SETUP means the score is high enough to investigate an entry; it does not automatically submit an order.</p></div>`}catch(e){document.querySelector('#content').innerHTML='<div class="bad">Unable to load Yahoo chart: '+esc(e.message)+'</div>'}}run();setInterval(run,30000);</script></body></html>
